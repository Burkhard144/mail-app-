name: Alte Versionen löschen

# Wird nur von Hand gestartet: GitHub → Aktionen (Actions) → „Alte Versionen löschen“ → „Workflow ausführen“ (Run workflow)
on:
  workflow_dispatch:
    inputs:
      behalten:
        description: "Wie viele der neuesten Versionen sollen bleiben?"
        required: true
        default: "8"

permissions:
  contents: write

jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    steps:
      - name: Alte Versionen und ihre Markierungen löschen
        env:
          GH_TOKEN: ${{ github.token }}
          BEHALTEN: ${{ inputs.behalten }}
        run: |
          set -e
          case "$BEHALTEN" in ''|*[!0-9]*) echo "Bitte eine Zahl eingeben"; exit 1;; esac
          if [ "$BEHALTEN" -lt 1 ]; then echo "Mindestens 1 Version muss bleiben"; exit 1; fi

          # alle Versionen, die neueste zuerst
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName' > alle.txt
          head -n "$BEHALTEN" alle.txt > behalten.txt
          echo "Gefunden: $(wc -l < alle.txt) Versionen – es bleiben:"
          cat behalten.txt

          tail -n +"$((BEHALTEN+1))" alle.txt | while read -r t; do
            echo "Lösche Version $t"
            gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done

          # übrig gebliebene Markierungen (Tags) ohne Version, z. B. von fehlgeschlagenen Bauläufen
          gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name' | grep '^v1\.0\.' | while read -r t; do
            if ! grep -qx "$t" behalten.txt; then
              echo "Lösche Markierung $t"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" || true
            fi
          done
          echo "Fertig."
