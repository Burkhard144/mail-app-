<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Mail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: drei schwebende Glasscheiben (Ordner · Liste · Lesen) über einem ruhigen Meeresverlauf; am Handy eine Scheibe nach der anderen */
:root{
  --bg:#dde8f4; --blob1:#a6cdf7; --blob2:#f3c58e; --blob3:#b9d3f0;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.8);
  --hi:rgba(255,255,255,.9); --lo:rgba(20,50,90,.10); --line:rgba(255,255,255,.75);
  --fg:#13233a; --muted:#56687f; --accent:#2f86e6; --accent-fg:#ffffff; --accent2:#c9711b;
  --danger:#bf3d36; --warn-bg:rgba(217,130,43,.16); --sel:rgba(47,134,230,.14); --shadow:rgba(18,40,75,.18);
  --font-display:"Outfit",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08121f; --blob1:#13427a; --blob2:#6b4318; --blob3:#173e5c;
  --glass:rgba(24,38,58,.55); --glass-strong:rgba(30,46,70,.88);
  --hi:rgba(255,255,255,.12); --lo:rgba(0,0,0,.35); --line:rgba(255,255,255,.12);
  --fg:#e3ecf6; --muted:#90a4bd; --accent:#6db4ff; --accent-fg:#06182e; --accent2:#f0a454;
  --danger:#ff7b72; --warn-bg:rgba(240,164,84,.14); --sel:rgba(109,180,255,.16); --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08121f; --blob1:#13427a; --blob2:#6b4318; --blob3:#173e5c;
  --glass:rgba(24,38,58,.55); --glass-strong:rgba(30,46,70,.88);
  --hi:rgba(255,255,255,.12); --lo:rgba(0,0,0,.35); --line:rgba(255,255,255,.12);
  --fg:#e3ecf6; --muted:#90a4bd; --accent:#6db4ff; --accent-fg:#06182e; --accent2:#f0a454;
  --danger:#ff7b72; --warn-bg:rgba(240,164,84,.14); --sel:rgba(109,180,255,.16); --shadow:rgba(0,0,0,.45); color-scheme:dark}

html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px;box-sizing:border-box;overflow:hidden}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(40vmax 40vmax at 8% 10%,var(--blob1),transparent 60%),
             radial-gradient(35vmax 35vmax at 95% 90%,var(--blob2),transparent 60%),
             radial-gradient(45vmax 45vmax at 70% 5%,var(--blob3),transparent 60%);opacity:.75}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.app{height:100%;display:grid;grid-template-columns:280px minmax(300px,390px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:14px}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:22px;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);
  box-shadow:inset 0 1px 0 var(--hi),inset 0 -2px 0 var(--lo),0 18px 40px -12px var(--shadow)}
.pane-head{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.pane-head h1,.pane-head h2{font-family:var(--font-display);margin:0;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pane-head h1{font-size:22px;letter-spacing:-.01em}
.pane-head h2{font-size:18px}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:0 8px 12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:12px;
  padding:8px 12px;background:linear-gradient(180deg,var(--hi),transparent 70%),var(--glass-strong);white-space:nowrap;
  box-shadow:inset 0 1px 0 var(--hi),0 2px 0 var(--lo),0 6px 14px -8px var(--shadow);transition:transform .12s}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 1px 0 var(--hi)}
.btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 60%),var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}
.btn.dangerfill{background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 60%),var(--danger);color:#fff;border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.icon{padding:8px;width:38px;height:38px}
.btn svg,.nav svg{width:18px;height:18px;flex:none}
.back{display:none}

.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;padding:14px 10px 6px;display:flex;align-items:center;gap:6px}
.label span{flex:1}
.nav{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:12px;min-width:0}
.nav:hover{background:var(--sel)}
.nav.active{background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--hi),0 4px 10px -6px var(--shadow);font-weight:600}
.nav .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-size:12px;font-variant-numeric:tabular-nums;background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:1px 7px;font-weight:600}
.count.dim{background:none;color:var(--muted);font-weight:500}
.count.warn{background:var(--accent2);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 2px rgba(0,0,0,.2),0 0 0 2px var(--glass-strong)}
.acc-head{display:flex;align-items:center;gap:2px}
.acc-head .nav{flex:1}
.addr{display:block;font-size:12px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.acc-err{font-size:12px;color:var(--danger);padding:2px 10px 6px 40px;line-height:1.4}
.sub{padding-left:22px}
.fold-row{display:flex;align-items:center;padding-left:calc(var(--d) * 14px)}
.fold-row .nav{flex:1;font-size:14px;padding:7px 10px}
.mini{border:0;background:none;color:var(--muted);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;flex:none}
.mini:hover{background:var(--sel);color:var(--fg)}
.mini svg{width:16px;height:16px}
.chev{display:grid;transition:transform .15s}
.collapsed .chev{transform:rotate(-90deg)}
.collapsed .sub{display:none}
.side-foot{padding:10px 12px 14px;display:flex;gap:6px;flex-wrap:wrap}
.side-foot .btn{flex:1;padding:8px 8px}

.search{margin:0 14px 10px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);box-shadow:inset 0 2px 4px var(--lo)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 14px 10px;padding:8px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line)}
.bar .n{font-weight:600;padding:0 6px;font-variant-numeric:tabular-nums}
.bar .btn{padding:6px 10px;font-size:14px}
.note{margin:0 14px 10px;font-size:13px;line-height:1.45;padding:8px 12px;border-radius:12px;background:var(--warn-bg)}
.note.err{color:var(--danger)}
.mail{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:3px 10px;padding:11px 12px;border-radius:14px;border:1px solid transparent;cursor:pointer;margin-bottom:4px;align-items:start}
.mail:hover{background:var(--sel)}
.mail.active{background:var(--glass-strong);border-color:var(--line);box-shadow:inset 0 1px 0 var(--hi),0 8px 18px -10px var(--shadow)}
.mail .ck{grid-row:1/3;width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.mail .ck[hidden]+.dot{grid-column:1/3}
.mail .dot{margin-top:5px;grid-row:1}
.mail .from{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail.unread .from,.mail.unread .subj{font-weight:700}
.mail .date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mail .subj{grid-column:3/5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;display:flex;gap:6px;align-items:center;min-width:0}
.mail .subj span{overflow:hidden;text-overflow:ellipsis}
.badge{font-style:normal;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--warn-bg);color:var(--accent2);flex:none;letter-spacing:.02em}
.star{color:var(--accent2)}
.empty{color:var(--muted);text-align:center;padding:40px 16px;line-height:1.5}
.empty b{display:block;color:var(--fg);font-family:var(--font-display);font-size:18px;margin-bottom:4px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--sel);border-top-color:var(--accent);animation:sp 0.8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}

.read-body{padding:4px 22px 24px;overflow-y:auto;flex:1;min-height:0}
.read-subj{font-family:var(--font-display);font-size:25px;font-weight:600;line-height:1.2;margin:4px 0 14px;text-wrap:balance;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#fff;flex:none;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.18),0 6px 12px -6px var(--shadow)}
.meta-txt{flex:1 1 200px;min-width:0}
.meta-txt .muted{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--glass-strong);border:1px solid var(--line);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.spambox{margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--warn-bg);font-size:13px;line-height:1.5}
.spambox b{color:var(--accent2)}
.spambox ul{margin:4px 0 0;padding-left:18px}
.trbar{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--sel);font-size:14px}
.trbar svg{width:20px;height:20px;flex:none;color:var(--accent)}
.trbar span{flex:1;min-width:140px}
.imgnote{margin-top:12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted)}
.text{max-width:72ch;line-height:1.65;padding-top:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.htmlframe{width:100%;border:0;border-radius:14px;margin-top:14px;background:#fff;min-height:120px;display:block}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.atts a{text-decoration:none;color:var(--fg);padding:6px 11px;font-size:13px}
.chip svg{width:15px;height:15px;flex:none}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:14px 14px 10px}
.toolbar .del{margin-left:auto}
.toolbar .btn.del{width:60px!important;height:50px!important;border-radius:16px!important;padding:0!important}
.toolbar .btn.del svg{width:30px;height:30px;stroke-width:2.6}
.p-list{position:relative}
.p-read{container-type:inline-size}
@container (max-width:720px){.toolbar .lbl{display:none}.toolbar{flex-wrap:nowrap;gap:5px}.toolbar .btn{width:38px;height:38px;padding:0;flex:none}}
#mails{padding-bottom:104px}
.fab{position:absolute;right:16px;bottom:16px;z-index:5;width:70px;height:70px;border-radius:22px;border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;color:var(--accent-fg);
  background:linear-gradient(180deg,rgba(255,255,255,.32),transparent 60%),var(--accent);
  background:linear-gradient(180deg,rgba(255,255,255,.3),transparent 60%),linear-gradient(180deg,color-mix(in srgb,var(--accent-hi) 66%,transparent),color-mix(in srgb,var(--accent) 66%,transparent));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.14),0 14px 26px -8px var(--shadow);transition:transform .12s}
.fab,.sbar{background:linear-gradient(180deg,rgba(255,255,255,.42),transparent 62%),linear-gradient(180deg,color-mix(in srgb,color-mix(in srgb,var(--accent-hi) 72%,#fff) 82%,transparent),color-mix(in srgb,color-mix(in srgb,var(--accent) 82%,#fff) 82%,transparent))!important}
.fab.sfab{right:auto;left:16px}
.sbar{position:absolute;left:16px;right:102px;bottom:22px;z-index:6;margin:0!important;height:60px;padding:0 6px 0 16px!important;border-radius:22px!important;border:1px solid rgba(255,255,255,.4)!important;color:var(--accent-fg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.12),0 14px 26px -8px var(--shadow)!important}
.sbar svg{color:var(--accent-fg)!important;width:20px!important;height:20px!important}
.sbar input{color:var(--accent-fg);font-size:16px}
.sbar input::placeholder{color:color-mix(in srgb,var(--accent-fg) 60%,transparent)}
.sbar .sx{border:0;background:rgba(255,255,255,.28);width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--accent-fg);cursor:pointer;flex:none}
.hidden-s{display:none!important}
#mails{padding-bottom:110px}
.fab:active{transform:translateY(2px)}
.fab svg{width:30px;height:30px;stroke-width:2.3}
.toolbar select{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--glass-strong);max-width:100%;min-width:0}

.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,20,24,.38);padding:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal{width:min(540px,100%);max-height:calc(100% - 20px);overflow-y:auto;border-radius:24px;padding:20px;background:var(--glass-strong);border:1px solid var(--line);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:inset 0 1px 0 var(--hi),0 30px 60px -20px var(--shadow)}
.modal h3{font-family:var(--font-display);font-size:20px;margin:0 0 14px;font-weight:600;overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label,.fl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--glass);box-shadow:inset 0 2px 4px var(--lo);width:100%;min-width:0}
.field textarea{min-height:170px;resize:vertical;line-height:1.5}
.field textarea.list{min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:32px;height:32px;border-radius:10px;border:2px solid transparent;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.2)}
.swatch.on{border-color:var(--fg)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.actions .spacer{flex:1}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 12px}
.hint.box{padding:10px 12px;border-radius:12px;background:var(--sel);color:var(--fg)}
.errtxt{color:var(--danger);font-size:13px;margin:0 0 10px;line-height:1.45}
.check{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;font-size:14px;line-height:1.4}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex:none}
details.adv{margin:4px 0 12px}
details.adv summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:4px 0 10px}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-list .btn{justify-content:flex-start}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:14px;
  background:var(--glass-strong);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 12px 30px -10px var(--shadow);max-width:calc(100% - 32px)}
.login{height:100%;display:grid;place-items:center}
.login .modal{width:min(400px,100%);text-align:left}
.login .logo{width:56px;height:56px;margin-bottom:10px}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--accent)}
.range output{font-variant-numeric:tabular-nums;font-weight:600;width:2ch;text-align:right}

@media (max-width:880px){
  .app{grid-template-columns:minmax(0,1fr)}
  .app[data-pane="side"] .p-list,.app[data-pane="side"] .p-read,
  .app[data-pane="list"] .p-side,.app[data-pane="list"] .p-read,
  .app[data-pane="read"] .p-side,.app[data-pane="read"] .p-list{display:none}
  .back{display:inline-flex}
  .read-subj{font-size:21px}
  .read-body{padding:4px 14px 20px}
  .row2,.row3{grid-template-columns:1fr}
  .toolbar .lbl{display:none}
  .toolbar{flex-wrap:nowrap;gap:5px;padding:10px 10px 8px}
  .toolbar .btn{width:38px;height:38px;padding:0;flex:none}
  body{padding-block:8px}
  .pane{border-radius:18px}
  .pane-head{padding:10px 10px 8px;gap:6px}
  .pane-head .btn.icon{width:36px;height:36px}
  .search{margin:0 10px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:3s!important}}

/* ===== 3D-Glasknöpfe ===== */
:root{--btn-top:rgba(255,255,255,.98);--btn-bot:rgba(214,227,244,.94);--btn-rim:rgba(16,44,88,.22);--btn-edge:#ffffff;
  --gloss:rgba(255,255,255,.85);--gloss2:rgba(255,255,255,.2);--accent-hi:#5aa6f5;--pop-bg:rgba(246,249,253,.97);--quote:#566a82}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--btn-top:rgba(96,126,168,.6);--btn-bot:rgba(22,36,58,.96);--btn-rim:rgba(0,0,0,.6);--btn-edge:rgba(255,255,255,.3);
  --gloss:rgba(255,255,255,.18);--gloss2:rgba(255,255,255,.03);--accent-hi:#9ccbff;--pop-bg:rgba(22,34,52,.97);--quote:#9db0c6}}
:root[data-theme="dark"]{--btn-top:rgba(96,126,168,.6);--btn-bot:rgba(22,36,58,.96);--btn-rim:rgba(0,0,0,.6);--btn-edge:rgba(255,255,255,.3);
  --gloss:rgba(255,255,255,.18);--gloss2:rgba(255,255,255,.03);--accent-hi:#9ccbff;--pop-bg:rgba(22,34,52,.97);--quote:#9db0c6}

.btn,.mini,.gsel,.atts .chip,.pop-opt.on{
  border:1px solid var(--btn-rim);color:var(--fg);
  background:linear-gradient(180deg,var(--gloss) 0%,var(--gloss2) 48%,transparent 52%),linear-gradient(180deg,var(--btn-top),var(--btn-bot));
  box-shadow:inset 0 1px 0 var(--btn-edge),inset 0 -2px 3px rgba(0,0,0,.08),0 2px 0 var(--btn-rim),0 7px 14px -6px var(--shadow);
  transition:transform .1s,box-shadow .1s}
.btn.danger{color:var(--danger)}
.btn:active:not(:disabled),.mini:active,.gsel:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--btn-edge),inset 0 2px 4px rgba(0,0,0,.12),0 0 0 var(--btn-rim)}
.btn.primary{color:var(--accent-fg);border-color:rgba(0,0,0,.2);
  background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.1) 48%,transparent 52%),linear-gradient(180deg,var(--accent-hi),var(--accent));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.18),0 2px 0 rgba(0,0,0,.2),0 8px 16px -6px var(--shadow)}
.btn.dangerfill{color:#fff;border-color:rgba(0,0,0,.2);
  background:linear-gradient(180deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.08) 48%,transparent 52%),var(--danger);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.2),0 8px 16px -6px var(--shadow)}
.btn.on{color:var(--accent);border-color:var(--accent);box-shadow:inset 0 2px 5px rgba(0,0,0,.14),0 0 0 1px var(--accent)}
.mini{border-radius:10px;width:30px;height:30px;color:var(--muted)}
.mini:hover{color:var(--fg);background:linear-gradient(180deg,var(--gloss) 0%,var(--gloss2) 48%,transparent 52%),linear-gradient(180deg,var(--btn-top),var(--btn-bot))}

/* ===== Glas-Auswahl ===== */
.diag{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:6px}
.diag li{display:flex;gap:8px;align-items:center;font-size:14px}

.diag-acc{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line)}

.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.c-atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.c-att{display:inline-flex;align-items:center;gap:6px;padding:5px 4px 5px 10px;border-radius:12px;background:var(--sel);font-size:13px;max-width:100%;min-width:0}
.c-att>svg{width:15px;height:15px;flex:none;color:var(--accent)}
.c-att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.c-att button{border:0;background:none;color:var(--muted);width:30px;height:30px;display:grid;place-items:center;border-radius:9px;cursor:pointer;flex:none}
.c-att button svg{width:15px;height:15px}
#list{position:relative}
.ptr{position:absolute;left:50%;top:96px;z-index:6;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--muted);pointer-events:none;opacity:0;transform:translate(-50%,0);
  background:linear-gradient(180deg,var(--gloss) 0%,var(--gloss2) 48%,transparent 52%),linear-gradient(180deg,var(--btn-top),var(--btn-bot));box-shadow:inset 0 1px 0 var(--btn-edge),0 6px 16px -6px var(--shadow)}
.ptr svg{width:24px;height:24px}
.ptr.ready{color:var(--accent)}
.ptr.spin svg{animation:sp .8s linear infinite;color:var(--accent)}
.pw-wrap{position:relative;display:block}
.pw-wrap input{width:100%;padding-right:58px;box-sizing:border-box}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:44px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);cursor:pointer;
  background:linear-gradient(180deg,var(--gloss) 0%,var(--gloss2) 48%,transparent 52%),linear-gradient(180deg,var(--btn-top),var(--btn-bot));box-shadow:inset 0 1px 0 var(--btn-edge),0 2px 0 var(--btn-rim)}
.pw-eye svg{width:22px;height:22px}
.pw-eye.on{color:var(--accent)}
.gs-native{position:absolute!important;opacity:0;pointer-events:none;width:1px!important;height:1px!important}
.gsel{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;min-width:0}
.gsel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.gsel svg{width:16px;height:16px;flex:none;color:var(--muted)}
.pop-back{position:fixed;inset:0;z-index:80;background:rgba(8,20,24,.32);display:grid;place-items:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.pop{width:min(440px,100%);max-height:70vh;overflow:auto;border-radius:22px;padding:8px;background:var(--pop-bg);border:1px solid var(--line);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:inset 0 1px 0 var(--hi),0 30px 60px -20px var(--shadow);display:flex;flex-direction:column;gap:4px}
.pop-opt{flex:none;line-height:1.35;border:1px solid transparent;background:none;text-align:left;padding:12px 14px;border-radius:14px;white-space:pre;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.pop-opt:hover{background:var(--sel)}
.pop-opt.on{font-weight:600;color:var(--accent)}

/* ===== Liste: Vorschau, Sortierordner, langes Drücken ===== */
.mail{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mail .av{grid-row:1/4;position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--avc);color:#fff;font-weight:700;font-size:16px;letter-spacing:.02em;margin-top:2px;
  box-shadow:inset 0 2px 3px rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.25),0 4px 10px -4px var(--shadow)}
.mail .ck[hidden]+.av{grid-column:1/3}
.mail .av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:contain;background:#fff;padding:8px;box-sizing:border-box;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.mail .av-acc{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 2px var(--pane-solid,#fff)}
.mail .date{align-self:center}
.biglist .mail{padding:14px 12px;gap:4px 12px;margin-bottom:2px;border-radius:16px}
:root{--card-bg:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.7));--card-line:rgba(255,255,255,.75);--card-sh:0 1px 2px rgba(20,45,90,.06),0 8px 18px -10px rgba(20,45,90,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card-bg:linear-gradient(180deg,rgba(52,74,106,.62),rgba(34,52,78,.55));--card-line:rgba(255,255,255,.07);--card-sh:0 1px 2px rgba(0,0,0,.25),0 10px 20px -10px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--card-bg:linear-gradient(180deg,rgba(52,74,106,.62),rgba(34,52,78,.55));--card-line:rgba(255,255,255,.07);--card-sh:0 1px 2px rgba(0,0,0,.25),0 10px 20px -10px rgba(0,0,0,.6)}
#mails .mail{background:var(--card-bg);border:1px solid var(--card-line);box-shadow:inset 0 1px 0 var(--hi),var(--card-sh);margin-bottom:10px}
#mails .mail:hover{filter:brightness(1.02)}
#mails .mail.active{box-shadow:inset 0 1px 0 var(--hi),0 0 0 2px rgba(47,134,230,.28),var(--card-sh)}
#mails .mail.unread{box-shadow:inset 0 1px 0 var(--hi),inset 0 -2.5px 0 rgba(47,134,230,.55),0 8px 16px -12px rgba(47,134,230,.35),var(--card-sh)}
#mails .mail.unread.active{box-shadow:inset 0 1px 0 var(--hi),inset 0 -2.5px 0 rgba(47,134,230,.55),0 0 0 2px rgba(47,134,230,.28),var(--card-sh)}
#mails .mrow{margin-bottom:0;content-visibility:auto;contain-intrinsic-size:auto 128px}
.biglist .mail .from{font-size:18px}
.biglist .mail .date{font-size:14px}
.biglist .mail .subj{font-size:16.5px}
.biglist .mail .prev{font-size:15px;line-height:1.45}
.biglist .mail .av{width:52px;height:52px;font-size:19px}
.mail .prev{grid-column:3/5;color:var(--muted);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.ftag{font-style:normal;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--sel);color:var(--accent);flex:none;white-space:nowrap}
.ctx-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.ctx-head>div{min-width:0}
.ctx-head .dot{margin-top:6px}
.ctx-head .muted{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== Adressbuch ===== */
.mail.contact{grid-template-columns:auto minmax(0,1fr);align-items:center}
.contact .cav{grid-row:1/3;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.3),transparent 55%),var(--accent);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 4px 10px -5px var(--shadow)}
.contact .from,.contact .subj{grid-column:2}
.contact .subj{color:var(--muted);font-weight:400;font-size:13px}
.avatar.big{width:58px;height:58px;font-size:24px;border-radius:18px;background:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;margin:18px 0 0;font-size:15px;max-width:60ch}
.kv dt{color:var(--muted);font-size:13px;font-weight:600;padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn.addc{height:28px;padding:0 9px;font-size:12px;border-radius:9px;gap:5px}
.btn.addc svg{width:15px;height:15px}
.field textarea.short{min-height:80px}

/* ===== Neue Mail ===== */
.modal.compose{width:min(700px,100%)}
.c-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.c-head h3{margin:0;flex:1;font-size:18px}
.c-fields{border:1px solid var(--line);border-radius:14px;background:var(--glass);margin-bottom:10px}
.c-row{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border-bottom:1px solid var(--line);position:relative;min-height:46px}
.c-row:last-child{border-bottom:0}
.c-row label{width:52px;font-size:12px;font-weight:600;color:var(--muted);flex:none;letter-spacing:.02em}
.c-row input{flex:1;min-width:0;border:0;background:none;outline:none;padding:8px 0;font-size:15px}
.c-row .gsel{flex:1;padding:6px 10px;font-size:14px;border-radius:10px}
.fmt{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.fmt b,.fmt i,.fmt u,.fmt s{font-size:16px}
.fmt-sizes{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-top:2px}
.col-dot{width:18px;height:18px;border-radius:50%;flex:none;background:var(--fg);box-shadow:inset 0 1px 2px rgba(255,255,255,.45),0 0 0 2px var(--glass-strong),0 1px 3px rgba(0,0,0,.25)}
.c-colors .swc{min-width:44px;justify-content:center}
.col-wheel{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#d32f2f,#ef6c00,#c99700,#2e7d32,#1e88e5,#7b1fa2,#c2185b,#d32f2f);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.col-wheel .col-dot{width:11px;height:11px;box-shadow:0 0 0 2px #fff}
.c-colors .swc .col-dot{width:22px;height:22px}
.c-aimenu{margin:8px 0 0}
.c-actions{display:grid!important;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:10px}
.c-actions .btn{justify-content:center}
.c-actions #c-send{grid-column:1/-1;height:54px;font-size:17px;border-radius:16px}
.c-actions #c-send svg{width:22px;height:22px}
.editor{min-height:220px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--glass);
  box-shadow:inset 0 2px 4px var(--lo);line-height:1.55;outline:none;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.editor:focus{border-color:var(--accent)}
.editor:empty::before{content:attr(data-ph);color:var(--muted)}
.editor blockquote,.editor .q-head{color:var(--quote)!important}
.ac-list{position:absolute;left:6px;right:6px;top:calc(100% + 4px);z-index:20;padding:6px;border-radius:16px;background:var(--pop-bg);border:1px solid var(--line);
  box-shadow:0 20px 40px -14px var(--shadow);display:flex;flex-direction:column;gap:2px}
.ac-item{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px}
.ac-item:hover{background:var(--sel)}
.ac-item small{display:block;color:var(--muted);font-size:12px}

@media (max-width:880px){
  .overlay.sheet,.pop-back{place-items:end center}
  .modal.sheet,.pop{border-radius:24px 24px 18px 18px}
  .overlay.compose{padding:6px}
  .modal.compose{height:100%;max-height:100%;display:flex;flex-direction:column;padding:12px}
  .modal.compose .editor{flex:1;max-height:none;min-height:160px}
  .c-row label{width:46px}
}


.lock .modal{text-align:center;display:flex;flex-direction:column;align-items:center}
.lock .logo{margin:0 auto 10px}
.lock h3{margin-bottom:4px}
.fp{width:96px;height:96px;border-radius:30px;margin:14px auto 10px;display:grid;place-items:center;color:var(--accent);border:1px solid var(--btn-rim);
  background:linear-gradient(180deg,var(--gloss) 0%,var(--gloss2) 48%,transparent 52%),linear-gradient(180deg,var(--btn-top),var(--btn-bot));
  box-shadow:inset 0 1px 0 var(--btn-edge),inset 0 -3px 4px rgba(0,0,0,.1),0 3px 0 var(--btn-rim),0 16px 30px -10px var(--shadow);transition:transform .15s,color .2s}
.fp svg{width:58px;height:58px}
.fp:active{transform:translateY(2px)}
.fp.ok{color:#2e9e5b;transform:scale(1.06)}
.hint.small{font-size:12px;margin-bottom:14px}
/* ===== Runde 3 ===== */
:root{--ok:#2e9e5b;--ok-bg:rgba(46,158,91,.14);--bad-bg:rgba(191,61,54,.12);--sw-off:rgba(16,58,68,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#5fd394;--ok-bg:rgba(95,211,148,.14);--bad-bg:rgba(255,123,114,.14);--sw-off:rgba(255,255,255,.16)}}
:root[data-theme="dark"]{--ok:#5fd394;--ok-bg:rgba(95,211,148,.14);--bad-bg:rgba(255,123,114,.14);--sw-off:rgba(255,255,255,.16)}

/* Wischen */
.mrow{position:relative;margin-bottom:4px;border-radius:14px;overflow:hidden}
.mrow .mail{margin-bottom:0;position:relative;z-index:1;background:transparent;touch-action:pan-y;transition:transform .18s ease}
.mrow .mail:not(.active){background:transparent}
.swipe-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;border-radius:14px;opacity:0;font-weight:600;font-size:13px;color:#fff;background:var(--accent)}
.swipe-bg span{display:flex;align-items:center;gap:6px}
.swipe-bg svg{width:18px;height:18px}
.mrow:has(.mail[style*="translate"]) .swipe-bg{opacity:1}
.mrow.to-l .swipe-bg{background:var(--danger)}
.mrow .sw-r{visibility:hidden}
.mrow.to-l .sw-r{visibility:visible}
.mrow.to-l .sw-l{visibility:hidden}
.mrow:has(.mail[style*="translate"]) .mail{background:var(--pop-bg)}
.mrow.arm .swipe-bg span{transform:scale(1.08)}
.clip-i svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px;color:var(--muted)}

/* Hinweise */
.note.ok{display:flex;align-items:center;gap:8px;background:var(--ok-bg);color:var(--fg)}
.note.ok span{flex:1}
.note.ok svg{width:18px;height:18px;color:var(--ok);flex:none}
.btn.trust-on{color:var(--ok)}
.warnbox{overflow-wrap:anywhere;min-width:0;display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--bad-bg);font-size:13px;line-height:1.5;border:1px solid rgba(191,61,54,.25)}
.warnbox svg{width:20px;height:20px;color:var(--danger);flex:none;margin-top:1px}
.unsub{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 10px 8px 12px;border-radius:14px;background:var(--sel);font-size:13px}
.unsub span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unsub>svg{width:18px;height:18px;color:var(--accent);flex:none}
.who-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn.addc.danger{color:var(--danger)}
.atts .chip{cursor:pointer;font:inherit;font-size:13px}
.atts .chip.bad{color:var(--danger);border-color:rgba(191,61,54,.45)}
.chooser{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.chooser .btn{justify-content:flex-start}
.toast.act{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px}
.toast.act .btn{flex:none}

/* KI */
.ai-btn svg{color:#8a5bd6}
.aibox{margin-top:14px;padding:12px 14px;border-radius:16px;border:1px solid rgba(138,91,214,.35);background:linear-gradient(135deg,rgba(138,91,214,.10),rgba(47,134,230,.08))}
.ai-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ai-h b{flex:1}
.ai-h svg{width:18px;height:18px;color:#8a5bd6}
.ai-t{white-space:pre-wrap;line-height:1.55;font-size:14px;overflow-wrap:anywhere;max-height:260px;overflow:auto}
.ai-ch{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.ai-a{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.ai-chips{display:flex;flex-direction:column;gap:8px;white-space:normal}
.ai-chips .btn{flex-direction:column;align-items:flex-start;white-space:normal;text-align:left;padding:10px 12px;gap:2px}
.ai-chips small{color:var(--muted);font-size:12.5px;line-height:1.4}
.modal.compose .aibox{margin:0 0 8px}

/* Gruppen */
.cav.grp,.avatar.grp{background:linear-gradient(180deg,rgba(255,255,255,.3),transparent 55%),#6c8f3a}
.cav.grp svg{width:20px;height:20px}
.avatar.grp svg{width:30px;height:30px}
.members{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.members .chip{gap:6px;padding:6px 10px}
.members .chip svg{width:14px;height:14px}
.members small{color:var(--muted)}
.pick{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:10px 12px 0;margin:6px 0 12px;background:var(--glass)}
.srcph svg{width:12px;height:12px;vertical-align:-1px;color:var(--muted)}

/* Postausgang */
.obrow{padding:12px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line);margin-bottom:8px}
.ob-t{display:flex;gap:10px;align-items:flex-start}
.ob-t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob-t small{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob-t>div{flex:1}
.ob-t .dot{margin-top:6px}
.cd{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent2);font-size:18px}
.ob-a{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}

/* Benachrichtigung über anderen Apps */
.notif{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;width:min(440px,calc(100% - 20px));
  padding:12px 14px 10px;border-radius:24px;background:var(--pop-bg);border:1px solid var(--line);
  backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);
  box-shadow:inset 0 1px 0 var(--hi),0 24px 50px -14px rgba(0,0,0,.45);animation:nIn .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes nIn{from{transform:translate(-50%,-30px);opacity:0}}
.n-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.n-app .logo{width:20px;height:20px;margin:0;display:block}
.n-from{font-weight:700}
.n-subj{font-weight:600;font-size:14px;margin-top:1px}
.n-text{font-size:14px;color:var(--fg);margin-top:6px;line-height:1.45;max-height:6.2em;overflow:auto;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;white-space:pre-wrap}
.n-code{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:8px 8px 8px 14px;border-radius:14px;background:var(--sel)}
.n-codev{font-size:24px;font-weight:700;letter-spacing:.18em;font-variant-numeric:tabular-nums;-webkit-user-select:all;user-select:all}
.n-act{display:flex;gap:8px;margin-top:10px}
.n-act .btn{flex:1}
.n-hint{font-size:11px;color:var(--muted);margin:8px 0 0;text-align:center}

/* Einstellungen */

  if(!sw.active){if(Math.abs(dx)>14&&Math.abs(dx)>Math.abs(dy)*1.5){sw.active=true;sw.row.style.transition='none'}else if(Math.abs(dy)>14){sw=null;return}else return}

function cleanLinks(html){let n=0;const out=html.replace(/href="([^"]+)"/gi,(all,u)=>{try{const x=new URL(u.replace(/&amp;/g,'&'));const before=[...x.searchParams.keys()].length;
  [...x.searchParams.keys()].forEach(k=>{if(/^(utm_|mc_|fbclid|gclid|dclid|msclkid|yclid|_hs|mkt_tok|uid$)/i.test(k))x.searchParams.delete(k)});
  const after=[...x.searchParams.keys()].length;if(after<before){n+=before-after;return `href="${x.toString().replace(/&/g,'&amp;')}"`}}catch(e){}return all});return {html:out,removed:n}}
function trustKey(addr){const a=String(addr||'').toLowerCase();const dom=a.split('@')[1]||'';return !dom||FREEMAIL.has(dom)?a:'@'+dom}
function isTrusted(addr){const a=String(addr||'').toLowerCase();if(!a)return false;const dom='@'+(a.split('@')[1]||'');return ((CFG.rules&&CFG.rules.allow)||[]).some(x=>{x=String(x).toLowerCase();return x===a||x===dom})}
async function setTrust(on){if(!CUR||!CUR.d)return;const addr=String(CUR.d.fromAddr||CUR.m.fromAddr||'').toLowerCase();if(!addr)return;
  const k=trustKey(addr),dom='@'+(addr.split('@')[1]||'');const not=x=>{x=String(x).toLowerCase();return x!==addr&&x!==dom};
  const allow=(CFG.rules.allow||[]).filter(not);let block=CFG.rules.block||[];if(on){allow.push(k);block=block.filter(not)}
  CFG.rules={...CFG.rules,allow,block};
  try{await api('saveRules',{rules:CFG.rules})}catch(e){toast(e.message);return}
  ITEMS.forEach(x=>{const fa=String(x.fromAddr||'').toLowerCase();if(fa===addr||fa.endsWith(dom))x.allowed=on});CUR.d.allowed=on;CUR.m.allowed=on;
  renderRead();renderList();toast(on?(k.startsWith('@')?'Alle Mails von '+k.slice(1)+' gelten jetzt als vertrauenswürdig':addr+' gilt jetzt als vertrauenswürdig'):'Vertrauen aufgehoben')}
function linkWarnings(html,sender){const out=[];try{const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('style,script,head,title').forEach(x=>x.remove());
  const brand=h=>{const p=String(h).toLowerCase().split('.');const two=/^(co|com|org|net|gov|ac)\.[a-z]{2}$/.test(p.slice(-2).join('.'));return p[p.length-(two?3:2)]||h};
  const sb=sender?brand(String(sender).split('@')[1]||''):'';
  doc.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');let host='';try{host=new URL(href).hostname.replace(/^www\./,'').toLowerCase()}catch(e){return}
    const txt=a.textContent.replace(/\s+/g,' ').trim();if(!txt||txt.length>120)return;
    const m=txt.match(/(?:^|[\s(„"'])((?:https?:\/\/)?(?:www\.)?(?:[a-z0-9-]+\.)+[a-z]{2,})(?=$|[\s\/)“"',.:;!?])/i);if(!m)return;
    const shown=m[1].toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];
    if(/^\d/.test(shown)||host.endsWith(shown)||shown.endsWith(host)||brand(host)===brand(shown))return;
    /* Link führt zur Firma des Absenders selbst (z. B. eBay-Händlername → ebay.de) – außer der Text gibt sich als vollständige Internetadresse aus (typisch für Betrug) */
    if(sb&&brand(host)===sb&&!/^(https?:\/\/|www\.)/i.test(m[1])&&!/\//.test(txt))return;
    out.push({shown:txt,host})})}catch(e){}return out}
function openLink(href,text){
  let host='';try{host=new URL(href).hostname}catch(e){return}
  const P=protLevel();const warn=linkWarnings(`<a href="${esc(href)}">${esc(text||'')}</a>`).length>0;
  const go=()=>{try{MailBridge.openUrl(href)}catch(e){}};
  if(P<2||(P===2&&!warn)){go();return}
  modal(`<h3>Link öffnen?</h3>${warn?`<div class="warnbox">${ic('block')}<div><b>Vorsicht, möglicher Betrug</b><br>Der Linktext zeigt etwas anderes als das tatsächliche Ziel.</div></div>`:''}
    <p class="hint">Ziel: <b style="color:var(--fg);overflow-wrap:anywhere">${esc(host)}</b></p><p class="hint" style="overflow-wrap:anywhere;font-size:12px">${esc(href)}</p>

}

function acWire(id,onGroup){
  const inp=$(id);if(!inp)return;const row=inp.closest('.c-row');let box=null,hits=[];
  const close=()=>{if(box){box.remove();box=null}};
  inp.addEventListener('input',()=>{close();const tok=inp.value.split(',').pop().trim().toLowerCase();if(!tok)return;
    const own=(CFG.contacts||[]).filter(c=>((c.name||'')+' '+c.email).toLowerCase().includes(tok)).map(c=>({t:'c',name:c.name,email:c.email}));
    const gr=(CFG.groups||[]).filter(g=>g.name.toLowerCase().includes(tok)).map(g=>({t:'g',g}));
    const ph=S_().phoneSuggest!==false?(CFG.phone||[]).filter(c=>!findContact(c.email)&&(c.name+' '+c.email).toLowerCase().includes(tok)).map(c=>({t:'p',name:c.name,email:c.email})):[];
    hits=[...gr,...own,...ph].slice(0,7);if(!hits.length)return;
    box=document.createElement('div');box.className='ac-list';
    box.innerHTML=hits.map((h,i)=>h.t==='g'?`<button type="button" class="ac-item" data-i="${i}"><b>${ic('users')} ${esc(h.g.name)}</b><small>Gruppe · ${h.g.members.length} Empfänger${h.g.bcc?' · als Bcc':''}</small></button>`
      :`<button type="button" class="ac-item" data-i="${i}"><b>${h.t==='p'?ic('phone')+' ':''}${esc(h.name||h.email)}</b><small>${esc(h.email)}${h.t==='p'?' · vom Handy':''}</small></button>`).join('');
    box.addEventListener('pointerdown',e=>{const b=e.target.closest('.ac-item');if(!b)return;e.preventDefault();const h=hits[+b.dataset.i];
      const parts=inp.value.split(',');parts.pop();
      if(h.t==='g'){inp.value=parts.join(',').replace(/^\s+/,'')+(parts.length?', ':'');close();if(onGroup)onGroup(h.g,inp);return}
      parts.push(' '+(h.name?`${h.name} <${h.email}>`:h.email));inp.value=parts.join(',').replace(/^\s+/,'')+', ';close();inp.focus()});
    row.appendChild(box)});
  inp.addEventListener('blur',()=>setTimeout(close,150));
}

/* ---- Übersetzen englischer Mails (in der App: Google-Übersetzung direkt auf dem Handy, kostenlos) ---- */
function looksEnglish(t){const w=String(t||'').toLowerCase().match(/[a-zäöüß']+/g)||[];if(w.length<6)return false;
  const en=new Set('the and you your to of for is are this that with have has will please our we be on at from not can it by an or was were hello thank thanks dear regards'.split(' '));
  const de=new Set('der die das und sie ihr ist nicht mit für wir ein eine zu den von auf im bitte ich sehr hallo danke grüße'.split(' '));
  let e=0,d=0;w.slice(0,500).forEach(x=>{if(en.has(x))e++;if(de.has(x))d++});return e>=3&&e>d*2}
let TRSTATE=null; // {k, nodes:[{n,orig,tr}], on}
function trNodes(){const f=$('hf');const out=[];
  if(f&&f.contentDocument&&f.contentDocument.body){const doc=f.contentDocument;const w=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);let n;
    while((n=w.nextNode())){const p=n.parentNode&&n.parentNode.nodeName;if(/^(SCRIPT|STYLE|TITLE)$/.test(p))continue;if(/[A-Za-z]{2}/.test(n.nodeValue))out.push(n)}}
  else{const el=document.querySelector('.read-body .text');if(el&&el.firstChild)out.push(el.firstChild)}
  const sj=document.querySelector('.read-subj');if(sj&&sj.firstChild&&/[A-Za-z]{2}/.test(sj.textContent))out.unshift(sj.firstChild);
  return out}
async function translateMail(){const bar=$('trbar');if(!bar)return;
  if(TRSTATE&&TRSTATE.k===SEL&&TRSTATE.nodes[0]&&TRSTATE.nodes[0].n.isConnected){TRSTATE.on=true;TRSTATE.nodes.forEach(x=>x.n.nodeValue=x.tr);trBar();return}
  bar.innerHTML=`${ic('lang')}<span>Wird übersetzt …${window.MailBridge?'<br><small style="color:var(--muted)">Beim allerersten Mal lädt das Handy einmalig das Sprachpaket Englisch–Deutsch (ca. 30 MB).</small>':''}</span>`;
  const nodes=trNodes();if(!nodes.length){trBar('Kein Text zum Übersetzen gefunden.');return}
  try{const texts=nodes.map(n=>n.nodeValue);const r=await api('translate',{texts,from:'en',to:'de'});const tr=r.texts||[];
    TRSTATE={k:SEL,on:true,nodes:nodes.map((n,i)=>({n,orig:texts[i],tr:tr[i]!=null?(/^\s/.test(texts[i])?' ':'')+String(tr[i]).trim()+(/\s$/.test(texts[i])?' ':''):texts[i]}))};
    TRSTATE.nodes.forEach(x=>x.n.nodeValue=x.tr);trBar()}
  catch(e){trBar(e.message)}}
function trToggle(){if(!TRSTATE||TRSTATE.k!==SEL||!(TRSTATE.nodes[0]&&TRSTATE.nodes[0].n.isConnected))return translateMail();TRSTATE.on=!TRSTATE.on;TRSTATE.nodes.forEach(x=>x.n.nodeValue=TRSTATE.on?x.tr:x.orig);trBar()}
function trBar(err){const bar=$('trbar');if(!bar)return;const hf=$('hf');if(hf&&hf.__fit)setTimeout(hf.__fit,50);
  if(err){bar.innerHTML=`${ic('lang')}<span>${esc(err)}</span><button class="btn sm" data-act="translate">Nochmal versuchen</button>`;return}
  bar.innerHTML=TRSTATE&&TRSTATE.on?`${ic('lang')}<span>Aus dem Englischen übersetzt</span><button class="btn sm" data-act="troriginal">Original anzeigen</button>`
    :`${ic('lang')}<span>Diese Mail ist auf Englisch.</span><button class="btn sm primary" data-act="troriginal">Auf Deutsch übersetzen</button>`}

(()=>{let y0=null,pull=0,busy=false;const TH=70;
  const ind=()=>{let e=$('ptr');if(!e){const l=$('list');if(!l)return null;e=document.createElement('div');e.id='ptr';e.className='ptr';e.innerHTML=ic('refresh');l.appendChild(e)}return e};
  const hide=()=>{const el=$('ptr');if(!el)return;el.style.transition='transform .25s,opacity .25s';el.style.opacity='0';el.style.transform='translate(-50%,0)';setTimeout(()=>{if(!busy)el.remove()},260)};
  document.addEventListener('touchstart',e=>{const m=e.target.closest&&e.target.closest('#mails');
    if(busy||!m||m.scrollTop>2||SELECTMODE||$('layer').innerHTML||V.type==='settings'||V.type==='contacts'){y0=null;return}
    y0=e.touches[0].clientY;pull=0},{passive:true});
  document.addEventListener('touchmove',e=>{if(y0==null)return;const m=$('mails');if(!m||m.scrollTop>2){y0=null;hide();return}
    pull=Math.max(0,e.touches[0].clientY-y0);if(pull<10)return;const el=ind();if(!el)return;
    const d=Math.min(pull*.55,95);el.style.transition='none';el.style.opacity=String(Math.min(1,d/TH));
    el.style.transform=`translate(-50%,${d}px) rotate(${Math.round(d*4)}deg)`;el.classList.toggle('ready',d>=TH)},{passive:true});
  document.addEventListener('touchend',()=>{if(y0==null)return;y0=null;const el=$('ptr');const d=Math.min(pull*.55,95);pull=0;
    if(el&&d>=TH){busy=true;el.classList.add('spin');el.style.transition='transform .2s';el.style.transform='translate(-50%,60px)';
      refreshAll().catch(()=>{}).finally(()=>{busy=false;hide()})}else hide()});
})();

const swH=(id,on,title,desc)=>`<label class="sw"><input type="checkbox" id="${id}" ${on?'checked':''}><span class="sw-ui" aria-hidden="true"></span><span class="sw-txt"><b>${title}</b>${desc?`<small>${desc}</small>`:''}</span></label>`;

function titleHtml(){
  if(V.type==='uni'){if(V.role==='junk')return 'Spam<small> · alle Konten</small>';if(V.role==='trash')return 'Papierkorb<small> · alle Konten</small>';return 'Posteingänge'}
  if(V.type==='box'){const a=accOf(V.acc),f=folderOf(V.acc,V.path);const n=f?(f.role!=='custom'&&ROLE_NAME[f.role]?ROLE_NAME[f.role]:f.name):V.path;return esc(n)+(a?`<small> · ${esc(a.name)}</small>`:'')}
  return esc(viewTitle())}
function dayLabel(v){if(!v)return 'Datum wählen';const d=new Date(v+'T12:00');return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})}
function datePick(btn){
  let sel=btn.dataset.v||'';const base=sel?new Date(sel+'T12:00'):new Date();let y=base.getFullYear(),mo=base.getMonth();
  const iso=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const n=new Date();const today=iso(n.getFullYear(),n.getMonth(),n.getDate());
  const p=document.createElement('div');p.className='pop-back';p.dataset.act='pop-close';document.body.appendChild(p);
  const draw=()=>{
    const off=(new Date(y,mo,1).getDay()+6)%7;const days=new Date(y,mo+1,0).getDate();
    let cells='';for(let i=0;i<off;i++)cells+='<span></span>';
    for(let d=1;d<=days;d++){const v=iso(y,mo,d);cells+=`<button type="button" class="cal-d ${v===sel?'on':''} ${v===today?'today':''}" data-d="${v}" aria-label="${dayLabel(v)}">${d}</button>`}
    p.innerHTML=`<div class="pop cal" role="dialog" aria-label="Datum wählen">
      <div class="cal-top"><span>${sel?new Date(sel+'T12:00').getFullYear():y}</span><b>${sel?new Date(sel+'T12:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'}):'Kein Datum gewählt'}</b></div>
      <div class="cal-nav"><button type="button" class="btn icon sm" data-nav="-1" aria-label="Voriger Monat">${ic('back')}</button><b>${new Date(y,mo,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button type="button" class="btn icon sm flip" data-nav="1" aria-label="Nächster Monat">${ic('back')}</button></div>
      <div class="cal-g">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<span class="cal-h">${x}</span>`).join('')}${cells}</div>
      <div class="actions"><button type="button" class="btn" data-c="clear">Löschen</button><span class="spacer"></span><button type="button" class="btn" data-c="cancel">Abbrechen</button><button type="button" class="btn primary" data-c="ok">Übernehmen</button></div></div>`;
    p.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{mo+=+b.dataset.nav;if(mo<0){mo=11;y--}if(mo>11){mo=0;y++}draw()});
    p.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{sel=b.dataset.d;draw()});
    p.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(c==='clear')btn.dataset.v='';if(c==='ok')btn.dataset.v=sel;
      if(c!=='cancel')btn.querySelector('span').textContent=dayLabel(btn.dataset.v);p.remove()});
  };
  draw();
}

const isTypingEl=el=>!!(el&&el.matches&&el.matches('input:not([type=checkbox]):not([type=radio]):not([type=range]),textarea,[contenteditable="true"]'));
const coarse=false;
let H0=innerHeight,kbReal=false,kbOff;
function setKb(v){document.documentElement.style.setProperty('--kb',v);document.documentElement.classList.toggle('kb-open',v!=='0px')}
setKb('0px');
if(window.visualViewport){visualViewport.addEventListener('resize',()=>{const v=visualViewport;const kb=Math.round(innerHeight-v.height-v.offsetTop);
  if(kb>80){kbReal=true;setKb(kb+'px')}else if(kbReal){kbReal=false;if(!isTypingEl(document.activeElement))setKb('0px')}})}
addEventListener('resize',()=>{if(!isTypingEl(document.activeElement))H0=innerHeight});
document.addEventListener('focusin',e=>{const el=e.target;if(!isTypingEl(el))return;clearTimeout(kbOff);
  if(coarse&&!kbReal)setKb('45vh');
  const box=el.closest('.modal:not(.compose),.read-body,.scroll');document.querySelectorAll('.kb-pad').forEach(x=>{if(x!==box)x.classList.remove('kb-pad')});if(box&&!el.closest('.modal.compose'))box.classList.add('kb-pad');

/* ---- Längere Texte am Handy: Eingabefenster oben, über der Tastatur ---- */
function openTypeSheet(src){
  if(document.querySelector('.ts-back'))return;
  const isCE=src.isContentEditable;
  const label=src.getAttribute('aria-label')||((src.closest('.field')||{}).querySelector?.call(src.closest('.field'),'label')||{}).textContent||'Text';
  const sh=document.createElement('div');sh.className='ts-back';
  sh.innerHTML=`<div class="typesheet" role="dialog" aria-label="${esc(label)}"><div class="ts-h"><b>${esc(label)}</b><button type="button" class="btn sm primary" id="ts-ok">${ic('tick')}Fertig</button></div>
    ${isCE?`<div class="sig-fmt"><button type="button" class="btn icon sm" data-tf="bold"><b>F</b></button><button type="button" class="btn icon sm" data-tf="italic"><i>K</i></button><button type="button" class="btn icon sm" data-tf="underline"><u>U</u></button></div>
    <div class="editor ts-ed" id="ts-ed" contenteditable="true" role="textbox" aria-multiline="true">${src.innerHTML}</div>`:`<textarea class="ts-ed" id="ts-ed">${esc(src.value)}</textarea>`}</div>`;
  document.body.appendChild(sh);const ed=$('ts-ed');
  sh.querySelectorAll('[data-tf]').forEach(b=>{b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>{ed.focus();document.execCommand(b.dataset.tf)}});
  const done=()=>{if(isCE)src.innerHTML=ed.innerHTML;else{src.value=ed.value;src.dispatchEvent(new Event('input',{bubbles:true}))}sh.remove();setKb('0px')};
  $('ts-ok').onclick=done;sh.addEventListener('click',e=>{if(e.target===sh)done()});
  ed.focus();try{const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);if(isCE){const s=getSelection();s.removeAllRanges();s.addRange(r)}else ed.setSelectionRange(ed.value.length,ed.value.length)}catch(_){}
}

/* Neue Mail von außen (mailto, „Teilen“, Ziehen): wartet bei Bedarf, bis die App entsperrt und geladen ist */
let MAILREADY=false;
const canCompose=()=>MAILREADY&&(UNLOCKED||!!(CFG.settings&&CFG.settings.lock&&CFG.settings.lock.on===false))&&!!(CFG.accounts&&CFG.accounts.length);
function queueCompose(pre){if(canCompose())compose(pre);else window.__pendingCompose=pre}
function flushCompose(){if(!CFG.accounts||!CFG.accounts.length)return;MAILREADY=true;const p=window.__pendingCompose;if(p&&canCompose()){window.__pendingCompose=null;setTimeout(()=>compose(p),60)}}
const textHtml=t=>esc(t).replace(/\r?\n/g,'<br>');
window.__compose=to=>queueCompose({to:to+', '});
window.__shareText=(subject,text)=>queueCompose({subject:subject||'',body:textHtml(text||'')});
window.__dropText=(text,x,y)=>{
  const body=$('c-body');
  if(!body||!canCompose()){queueCompose({body:textHtml(text)});return}
  const el=document.elementFromPoint(x,y);
  if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA')&&el.closest('.c-fields')){
    const a=el.selectionStart??el.value.length,b=el.selectionEnd??a;
    el.value=el.value.slice(0,a)+text+el.value.slice(b);el.focus();el.dispatchEvent(new Event('input',{bubbles:true}));return}
  let r=null;
  if(el&&body.contains(el)&&document.caretRangeFromPoint){r=document.caretRangeFromPoint(x,y);if(r&&!body.contains(r.startContainer))r=null}
  if(!r){const g=body.querySelector('.gp-body')||body;r=document.createRange();r.selectNodeContents(g);r.collapse(false)}
  body.focus();const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
  document.execCommand('insertText',false,text);
};
start();
</script>
</body></html>
